services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 5s
      timeout: 10s
      retries: 30
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragnexus
      POSTGRES_PASSWORD: ragnexus
      POSTGRES_DB: ragnexus
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragnexus -d ragnexus"]
      interval: 2s
      timeout: 3s
      retries: 30

  init-db:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docs/sql/schema.sql:/schema.sql:ro
    entrypoint: ["sh", "-c"]
    command: ["psql postgresql://ragnexus:ragnexus@db:5432/ragnexus -f /schema.sql"]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PG_DSN: postgresql://ragnexus:ragnexus@db:5432/ragnexus
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_ENABLED: "true"
      RETRIEVAL_MODE: hybrid
    depends_on:
      init-db:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
volumes:
  pgdata:
  esdata:
