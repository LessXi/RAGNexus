services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 5s
      timeout: 10s
      retries: 30
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragnexus
      POSTGRES_PASSWORD: ragnexus
      POSTGRES_DB: ragnexus
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragnexus -d ragnexus"]
      interval: 2s
      timeout: 3s
      retries: 30

  init-db:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docs/sql/schema.sql:/schema.sql:ro
    entrypoint: ["sh", "-c"]
    command: ["psql postgresql://ragnexus:ragnexus@db:5432/ragnexus -f /schema.sql"]
    restart: "no"

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfusedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=2132220172f966cf1c69ba2603d3c79a31c6f6a29a6019288b3b66f01f019409
      - ENCRYPTION_KEY=032486f1f3a54ad8e573ebd3ed40381acaacf048dbdebaf4c84c8e8c7d896b09
    depends_on:
      langfuse-db:
        condition: service_healthy
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PG_DSN: postgresql://ragnexus:ragnexus@db:5432/ragnexus
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_ENABLED: "true"
      RETRIEVAL_MODE: hybrid
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      init-db:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: .venv/bin/celery -A src.ragnexus.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      PG_DSN: postgresql://ragnexus:ragnexus@db:5432/ragnexus
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      init-db:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    command: .venv/bin/celery -A src.ragnexus.celery_app beat --loglevel=info
    env_file: .env
    environment:
      PG_DSN: postgresql://ragnexus:ragnexus@db:5432/ragnexus
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
  redisdata:
  langfusedata:
